<!DOCTYPE html><html lang="en" data-page="forgot-password"><head>
<script src="/static/theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password | JARVIS AI</title><style>body{font-family:Arial,sans-serif;background:#f9f9f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{width:min(420px,90vw);background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px #00000012}h1{margin-top:0}p{color:#666}input,button{width:100%;box-sizing:border-box;height:44px;border-radius:8px;margin-top:10px}input{border:1px solid #ddd;padding:0 12px}button{border:0;background:#000;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:16px;padding:12px;border-radius:8px;background:#eee;display:none}.back{display:inline-block;margin-top:18px;color:#176b4d;text-decoration:none}</style><link rel="stylesheet" href="/static/theme.css">
</head><body><div class="card"><h1>Forgot Password</h1><p>Enter your account email and we will send a password reset link.</p><form id="f"><input id="email" type="email" placeholder="you@example.com" required><button type="submit">Send Reset Link</button></form><div id="msg" class="msg"></div><a class="back" href="/login">← Back to Login</a></div><script>f.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='block';msg.textContent='Sending...';try{const r=await fetch('/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim().toLowerCase()})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Could not send reset email.');msg.textContent=d.message||'Reset email sent.'}catch(err){msg.textContent=err.message}});</script></body></html>
