<!DOCTYPE html><html lang="en" data-page="reset-password"><head>
<script src="/static/theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password | JARVIS AI</title><style>body{font-family:Arial,sans-serif;background:#f9f9f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{width:min(420px,90vw);background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px #00000012}h1{margin-top:0}p{color:#666}input,button{width:100%;box-sizing:border-box;height:44px;border-radius:8px;margin-top:10px}input{border:1px solid #ddd;padding:0 12px}button{border:0;background:#000;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:16px;padding:12px;border-radius:8px;background:#eee;display:none}.back{display:inline-block;margin-top:18px;color:#176b4d;text-decoration:none}</style><link rel="stylesheet" href="/static/theme.css">
</head><body><div class="card"><h1>Set New Password</h1><p>Choose a new password for your JARVIS AI account.</p><form id="f"><input id="password" type="password" minlength="8" placeholder="New password" required><input id="confirm" type="password" minlength="8" placeholder="Confirm new password" required><button type="submit">Reset Password</button></form><div id="msg" class="msg"></div><a class="back" href="/login">← Back to Login</a></div><script>
const form = document.getElementById('f');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const messageBox = document.getElementById('msg');
const token = new URLSearchParams(window.location.search).get('token');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  messageBox.style.display = 'block';

  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (!token) {
    messageBox.textContent = 'Invalid reset token.';
    return;
  }

  if (password.length < 8) {
    messageBox.textContent = 'Password must be at least 8 characters.';
    return;
  }

  if (password !== confirmPassword) {
    messageBox.textContent = 'Passwords do not match.';
    return;
  }

  messageBox.textContent = 'Updating password...';

  try {
    const response = await fetch('/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ token: token, password: password })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.detail || 'Could not reset password.');
    }

    messageBox.textContent = data.message || 'Password reset successfully.';
    form.reset();

    setTimeout(() => {
      window.location.href = '/login';
    }, 1200);
  } catch (error) {
    messageBox.textContent = error.message || 'Could not reset password.';
  }
});
</script></body></html>
